<p>这是我的第一篇博客文章。</p>

<p>这个博客是用 <strong>Python + Jinja2</strong> 搭建的：</p>

<ul>
    <li><code>build.py</code> 读取 content/ 下的 HTML 片段</li>
    <li>Jinja2 模板引擎把它们渲染成完整页面</li>
    <li>输出到 output/ 目录，直接用浏览器打开</li>
</ul>

<p>不需要服务器，不需要数据库，纯静态文件。</p>
